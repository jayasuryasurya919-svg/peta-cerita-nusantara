<!DOCTYPE html>
<html lang="id">
<head>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/galeri.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo-peta-cerita.svg">
</head>
<body data-kategori="tombak">
  <nav class="navbar">
    <a href="index.html" class="logo" aria-label="Peta Cerita Nusantara, beranda">
      <img src="assets/logo-peta-cerita.svg" alt="" width="44" height="44">
      <span class="logo-lockup"><span class="logo-name">Peta Cerita</span><span class="logo-kicker">Nusantara</span></span>

    <div class="nav-links">
      <a href="index.html">Beranda</a>
      <a href="peta.html">Peta</a>
      <a href="wayang.html">Wayang</a>

      <a href="tombak.html" class="aktif">Tombak</a>

  <main>
    <section class="galeri-section">
      <h2>Tombak Nusantara</h2>
      <p class="galeri-sub">Ragam dapur tombak pusaka beserta bentuk bilah dan makna filosofinya.</p>
      <div class="galeri-kontrol">
        <input type="search" id="cari-galeri" class="galeri-cari" placeholder="Cari dapur tombak atau daerah..." aria-label="Cari dapur tombak">
        <span class="galeri-jumlah" id="galeri-jumlah"></span>
      </div>
      <p class="info-kosong" id="galeri-kosong" hidden>Belum ada yang cocok dengan pencarianmu.</p>
      <div class="galeri-grid" id="galeri-grid"></div>
    </section>
  </main>

  <footer class="footer">
    &copy; 2026 Peta Cerita Nusantara. Dibuat untuk International Digital Coding Competition.
  </footer>

  <div class="semar-widget" id="semar-widget">
    <div class="semar-bubble hidden" id="semar-bubble">
      <div class="semar-header">
        <span class="semar-name">Ki Semar</span>
        <button class="semar-close" id="semar-close">&times;</button>
      </div>
      <p class="semar-text" id="semar-text"></p>
      <div class="semar-controls">
        <span class="semar-step" id="semar-step"></span>
        <button class="semar-next" id="semar-next"></button>
      </div>
    </div>
    <button class="semar-avatar" id="semar-avatar" title="Bicara dengan Ki Semar">
      <svg viewBox="0 0 100 100" width="56" height="56">
        <circle cx="50" cy="50" r="45" fill="#2b1e10" stroke="#d4af37" stroke-width="3"/>
        <path d="M50 15 Q55 25 50 35 Q45 25 50 15 Z" fill="#d4af37"/>
        <circle cx="50" cy="48" r="22" fill="#f4e4bc"/>
        <circle cx="42" cy="45" r="3" fill="#2b1e10"/>
        <circle cx="58" cy="45" r="3" fill="#2b1e10"/>
        <path d="M40 55 Q50 65 60 55" fill="none" stroke="#2b1e10" stroke-width="3" stroke-linecap="round"/>
        <path d="M25 75 Q50 60 75 75 Q50 95 25 75 Z" fill="#d4af37"/>
      </svg>
    </button>
  </div>

  <script src="js/data-budaya.js"></script>
  <script src="js/galeri.js"></script>
  <script src="js/semar.js"></script>
